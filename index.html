<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOAT / SCAT</title>
<style>
:root{
  --ink:#1B2430; --paper:#FFFFFF; --muted:#66707C; --line:#D8DDE3; --rail:#F2F4F6; --hover:#F7F8FA;
  --mark:#B45309; --mark-bg:#FBF1E6; --na:#8A929C; --na-bg:#F1F2F4; --note:#0F766E; --note-bg:#E8F4F2;
  --focus:#2563EB; --danger:#B91C1C;
  --fs:14px; --row:36px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 11px;background:var(--paper)}
button:hover{background:var(--hover)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#2c3746}
button.link{border:none;padding:2px 4px;color:var(--note);background:none}
button.danger{color:var(--danger)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:64px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:18px}h2{font-size:16px}h3{font-size:14px}
a{color:var(--note)}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.top .brand{font-weight:700;letter-spacing:.2px}
.top .crumbs{display:flex;gap:6px;align-items:center;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumbs span{opacity:.5}
.top .crumbs button.link{padding:0;color:var(--ink)}
.top .crumbs b{overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--ink);color:#fff}

main{padding:16px;max-width:1240px;margin:0 auto}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid2 .span{grid-column:1/-1}
label.f{display:block}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}

/* tables */
table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-weight:600;font-size:12px;color:var(--muted)}
table.list tr.click{cursor:pointer}
table.list tr.click:hover{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* analysis layout */
.an{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.rail{position:sticky;top:56px;background:var(--rail);border-radius:6px;padding:6px}
.rail button.rb{display:flex;width:100%;justify-content:space-between;align-items:center;border:none;background:none;border-radius:4px;padding:8px 10px;text-align:left}
.rail button.rb:hover{background:#fff}
.rail button.rb.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.rail .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail .cnt b{color:var(--mark)}
.rail hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
.rail .go{margin:6px 4px 2px;width:calc(100% - 8px)}
.blockhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.keys{font-size:12px;color:var(--muted)}

.items{border-top:1px solid var(--line)}
.grp{padding:12px 8px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.item{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;min-height:var(--row);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.item:hover{background:var(--hover)}
.item .st{height:var(--row);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--na)}
.item .tx{padding:6px 6px 6px 0}
.item .cb{height:var(--row);display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.45}
.item:hover .cb{opacity:1}
.item.s1{background:var(--mark-bg)}
.item.s1 .st{color:var(--mark)}
.item.s1 .tx{font-weight:600}
.item.hc .cb{color:var(--note);opacity:1}
.cmt{padding:4px 8px 10px 44px;border-bottom:1px solid var(--line);background:var(--note-bg)}
.cmt textarea{min-height:52px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{font-style:normal}

/* report */
.rp{max-width:1100px}
.rp .rhead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.rp .rhead dt{color:var(--muted)}
.rp .rhead dd{margin:0}
.rp .rhead .wide{grid-column:1/-1;white-space:pre-wrap}
.rp h2{margin-top:18px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.rt td.g{padding-top:8px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--ink)}
table.rt td.st{width:26px;text-align:center;font-size:15px}
table.rt td.c{width:40%;white-space:pre-wrap;color:#333}
table.rt tr.s1 td.st{color:var(--mark)}
table.rt tr.s1 td.tx{font-weight:600}
table.rt tr.s0 td{color:var(--na)}
table.rt.dense td{padding:1px 5px;line-height:1.3}
.rp .none{padding:6px;color:var(--muted);font-style:italic}
.rp .concl{white-space:pre-wrap;border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.rp .foot{margin-top:18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

/* settings */
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start;font-size:13px}
.tax{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tax textarea{min-height:260px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre}
.help{background:var(--rail);padding:10px 12px;border-radius:6px;font-size:13px}
.help code{background:#fff;padding:0 4px;border-radius:3px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:760px){
  .an{grid-template-columns:1fr}
  .rail{position:static;display:flex;flex-wrap:wrap;gap:4px}
  .rail button.rb{width:auto;padding:6px 10px;gap:6px}
  .rail hr{display:none}
  .rail .go{width:auto;margin:0}
  .grid2{grid-template-columns:1fr}
  .keys{display:none}
  main{padding:10px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  .top,.noprint,.toast{display:none!important}
  body{font-size:11.5px}
  main{padding:0;max-width:none}
  .rp .rhead{border-color:#999}
  .rp h2{break-after:avoid}
  .rp .blk{break-inside:avoid}
  table.rt td{border-bottom-color:#bbb}
  table.rt td.g{border-bottom-color:#000}
  .rp .foot{position:fixed;bottom:0;left:0;right:0}
  .rp.full .blocks{column-count:2;column-gap:10mm;column-fill:balance}
  .rp.full .blk{break-inside:auto}
  .rp.full table.rt tr{break-inside:avoid}
}
</style>
</head>

function starterTaxonomy(){return {ver:2,blocks:Object.keys(STARTER_TEXT).map(k=>parseTax(k,STARTER_TEXT[k],{items:[]}))};}

/* ---------- Kinney & Wiruth scales ---------- */
const KW={
 W:[[10,'Expected','Te verwachten'],[6,'Quite possible','Zeer wel mogelijk'],[3,'Unusual','Ongewoon'],[1,'Unlikely, but possible in borderline case','Onwaarschijnlijk, maar mogelijk in grensgeval'],[0.3,'Conceivable, but unlikely','Denkbaar, maar onwaarschijnlijk'],[0.2,'Practically impossible','Praktisch onmogelijk'],[0.1,'Virtually inconceivable','Bijna niet denkbaar']],
 B:[[10,'Continuous','Voortdurend'],[6,'Regularly (daily)','Regelmatig (dagelijks)'],[3,'Occasionally (weekly)','Af en toe (wekelijks)'],[2,'Sometimes (monthly)','Soms (maandelijks)'],[1,'Rarely (yearly)','Zelden (jaarlijks)'],[0.5,'Very rarely','Zeer zelden']],
 E:[[40,'Disaster: several fatalities (acute or delayed)','Ramp: enkele doden (acuut of op termijn)'],[15,'Very serious: one fatality (acute or delayed)','Zeer ernstig: een dode (acuut of op termijn)'],[7,'Serious: irreversible effect (disability)','Ernstig: irreversibel effect (invaliditeit)'],[3,'Significant: injury with lost time','Belangrijk: letsel en verzuim'],[1,'Minor: injury without lost time (first aid) or nuisance','Gering: letsel zonder verzuim (EHBO) of hinder']]};
function kwScore(a){if(!a.kwW||!a.kwB||!a.kwE)return null;const r=a.kwW*a.kwB*a.kwE;const cls=r>400?0:r>200?1:r>70?2:r>20?3:4;return {r:Math.round(r*10)/10,cls};}
function kwText(a){const k=kwScore(a);return k?`${a.kwW} × ${a.kwB} × ${a.kwE} = ${k.r} · ${t('kwClass')[k.cls]}`:t('kwNone');}

/* ---------- state ---------- */
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);
function fresh(){return {v:1,lang:'en',taxonomy:starterTaxonomy(),projects:[],ui:{view:'projects',pid:null,aid:null,step:'loss',report:'exc'}};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return s;}catch(e){}return null;}
let state=load()||fresh();
if(!state.taxonomy.ver){state.taxonomy=starterTaxonomy();}
for(const p of state.projects)for(const a of p.analyses)for(const id in a.marks)if(a.marks[id].s===2)a.marks[id].s=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('Storage error: '+e.message);}}
const proj=()=>state.projects.find(p=>p.id===state.ui.pid);
const ana=()=>{const p=proj();return p&&p.analyses.find(a=>a.id===state.ui.aid);};
const block=k=>state.taxonomy.blocks.find(b=>b.key===k);
const name=it=>(state.lang==='nl'&&it.nl)?it.nl:it.en;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mark=(a,id)=>a.marks[id]||{s:0,c:''};
const isDev=m=>m.s===1||!!(m.c&&m.c.trim());
const GL=['–','●'];

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600);}
function go(view,extra){Object.assign(state.ui,{view},extra||{});save();render();window.scrollTo(0,0);}

/* ---------- counts ---------- */
function blockCounts(a,key){let m=0,c=0,tot=0;for(const it of block(key).items){if(it.t)continue;tot++;const k=mark(a,it.id);if(k.s===1)m++;if(k.c&&k.c.trim())c++;}return {m,c,tot};}
function devCount(a){return Object.values(a.marks).filter(isDev).length;}

/* ---------- render ---------- */
function render(){renderTop();const v=state.ui.view;const app=document.getElementById('app');
  if(v==='projects')app.innerHTML=vProjects();
  else if(v==='project')app.innerHTML=vProject();
  else if(v==='analysis')app.innerHTML=vAnalysis();
  else if(v==='report')app.innerHTML=vReport();
  else if(v==='summary')app.innerHTML=vSummary();
  else if(v==='settings')app.innerHTML=vSettings();
  document.documentElement.lang=state.lang;
  setPrintOrientation();
}
function renderTop(){
  const p=proj(),a=ana();
  let crumbs=`<button class="link" data-go="projects">${t('projects')}</button>`;
  if(p&&state.ui.view!=='projects')crumbs+=`<span>›</span><button class="link" data-go="project"><b>${esc(p.name)}</b></button>`;
  if(a&&(state.ui.view==='analysis'||state.ui.view==='report'))crumbs+=`<span>›</span><b>${esc(a.date||'')} ${esc(short(a.description)||t('untitled'))}</b>`;
  if(state.ui.view==='summary')crumbs+=`<span>›</span><b>${t('summary')}</b>`;
  if(state.ui.view==='settings')crumbs+=`<span>›</span><b>${t('settings')}</b>`;
  document.getElementById('top').innerHTML=`<div class="brand">${t('appName')}</div><div class="crumbs">${crumbs}</div>
   <div class="seg"><button data-lang="en" class="${state.lang==='en'?'on':''}">EN</button><button data-lang="nl" class="${state.lang==='nl'?'on':''}">NL</button></div>
   <button data-go="settings" title="${t('settings')}">⚙</button>`;
}
const short=(s,n=48)=>{s=(s||'').trim().split('\n')[0];return s.length>n?s.slice(0,n-1)+'…':s;};

function vProjects(){
  const rows=state.projects.slice().sort((x,y)=>(y.updated||'').localeCompare(x.updated||'')).map(p=>`<tr class="click" data-open-p="${p.id}"><td><b>${esc(p.name)}</b></td><td>${esc(p.site||'')}</td><td class="num">${p.analyses.length}</td><td class="muted">${esc((p.updated||'').slice(0,10))}</td><td class="num"><button class="link danger" data-del-p="${p.id}">${t('del')}</button></td></tr>`).join('');
  return `<div class="stack">
   <div class="row"><h1 class="grow">${t('projects')}</h1></div>
   <form id="newProj" class="row" autocomplete="off"><input type="text" name="name" placeholder="${t('projectName')}" required style="max-width:280px"><input type="text" name="site" placeholder="${t('site')}" style="max-width:240px"><button class="primary">${t('newProject')}</button></form>
   ${state.projects.length?`<table class="list"><thead><tr><th>${t('projectName')}</th><th>${t('site')}</th><th class="num">${t('analyses')}</th><th>${t('updated')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t('noProjects')}</div>`}
   <p class="small muted">${t('storage')}</p></div>`;
}

function vProject(){
  const p=proj();if(!p)return vProjects();
  const rows=p.analyses.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).map(a=>`<tr class="click" data-open-a="${a.id}">
    <td style="white-space:nowrap">${esc(a.date||'')}</td><td>${esc(short(a.description,70))||'<span class="muted">'+t('untitled')+'</span>'}</td><td>${a.sev?esc(t('sev')[a.sev-1]):''}${(()=>{const k=kwScore(a);return k?' · R '+k.r:'';})()}</td>
    <td>${t(a.status||'draft')}</td><td class="num">${devCount(a)}</td>
    <td class="num" style="white-space:nowrap"><button class="link" data-rep-a="${a.id}">${t('report')}</button> <button class="link" data-dup-a="${a.id}">${t('duplicate')}</button> <button class="link danger" data-del-a="${a.id}">${t('del')}</button></td></tr>`).join('');

function vAnalysis(){

  const step=state.ui.step;
  const railBtn=(k,label,cnt)=>`<button class="rb ${step===k?'on':''}" data-step="${k}"><span>${label}</span><span class="cnt">${cnt??''}</span></button>`;
  let rail=railBtn('details',t('details'));
  for(const k of BLOCKS){const c=blockCounts(a,k);rail+=railBtn(k,t(k+'S'),`<b>${c.m}</b>${c.c?' ✎'+c.c:''}<span class="muted">/${c.tot}</span>`);}
  rail+=railBtn('conclusions',t('conclusions'),a.conclusions?'✎':'');
  rail+=`<hr><button class="go primary" data-go="report">${t('goReport')}</button>`;
  let main='';
  if(step==='details')main=vDetails(a);
  else if(step==='conclusions')main=`<h2>${t('conclusions')}</h2><textarea data-f="conclusions" rows="12" placeholder="${t('conclPh')}" style="margin-top:10px">${esc(a.conclusions||'')}</textarea>`;
  else main=vBlock(a,step);
  return `<div class="an"><nav class="rail">${rail}</nav><section>${main}</section></div>`;
}
function vDetails(a){
  const sev=[0,1,2,3,4,5].map(i=>`<option value="${i}" ${(a.sev||0)===i?'selected':''}>${i?esc(t('sev')[i-1]):'—'}</option>`).join('');
  return `<h2>${t('details')}</h2><div class="grid2" style="margin-top:10px">
   <label class="f"><span>${t('date')}</span><input type="date" data-f="date" value="${esc(a.date||'')}"></label>
   <label class="f"><span>${t('site')}</span><input type="text" data-f="site" value="${esc(a.site||'')}"></label>
   <label class="f"><span>${t('analyst')}</span><input type="text" data-f="analyst" value="${esc(a.analyst||'')}"></label>
   <label class="f"><span>${t('severity')}</span><select data-f="sev">${sev}</select></label>
   <label class="f span"><span>${t('kw')}</span></label>
   ${['W','B','E'].map(k=>`<label class="f"><span>${t('kw'+k)}</span><select data-f="kw${k}"><option value="0">—</option>${KW[k].map(o=>`<option value="${o[0]}" ${a['kw'+k]===o[0]?'selected':''}>${o[0]} · ${state.lang==='nl'?o[2]:o[1]}</option>`).join('')}</select></label>`).join('')}
   <label class="f"><span>${t('kwR')}</span><div id="kwOut" style="padding:6px 0;font-weight:600">${kwText(a)}</div></label>
   <label class="f"><span>${t('status')}</span><select data-f="status"><option value="draft" ${a.status!=='final'?'selected':''}>${t('draft')}</option><option value="final" ${a.status==='final'?'selected':''}>${t('final')}</option></select></label>
   <label class="f span"><span>${t('description')}</span><textarea data-f="description" placeholder="${t('descPh')}">${esc(a.description||'')}</textarea></label>
   <label class="f span"><span>${t('lossDesc')}</span><textarea data-f="lossDesc" placeholder="${t('lossPh')}">${esc(a.lossDesc||'')}</textarea></label>
  </div>`;
}
function itemRow(a,it){
  const m=mark(a,it.id),open=state.ui.openC===it.id;
  return `<div class="item s${m.s} ${m.c&&m.c.trim()?'hc':''}" tabindex="0" data-id="${it.id}" role="button" aria-pressed="${m.s===1}">
    <span class="st">${GL[m.s]}</span><span class="tx">${esc(name(it))}</span><span class="cb" data-c="${it.id}" title="${t('comment')}">✎</span></div>
   <div class="cmt ${open?'':'hidden'}" data-cw="${it.id}"><textarea data-cm="${it.id}" placeholder="${t('commentPh')}">${esc(m.c||'')}</textarea></div>`;
}
function vBlock(a,key){
  const b=block(key);const c=blockCounts(a,key);
  const rows=b.items.map(it=>it.t?`<div class="grp">${esc(name(it))}</div>`:itemRow(a,it)).join('');
  return `<div class="blockhead"><h2>${t(key)}</h2><span class="muted">${c.m} ${t('marked')} / ${c.tot}</span></div>
   <div class="keys">${t('keys')}</div>
   <div class="items" id="items">${rows}</div>
   <div class="legend"><i>${t('legend')}</i></div>`;
}

function reportBlock(a,key,mode){
  const b=block(key);let out='';let anyDev=false,pendingGroup='';
  for(const it of b.items){
    if(it.t){pendingGroup=`<tr><td class="g" colspan="3">${esc(name(it))}</td></tr>`;if(mode==='full'){out+=pendingGroup;pendingGroup='';}continue;}
    const m=mark(a,it.id);
    if(mode==='exc'&&!isDev(m))continue;
    if(pendingGroup){out+=pendingGroup;pendingGroup='';}
    anyDev=true;
    out+=`<tr class="s${m.s}"><td class="st">${GL[m.s]}</td><td class="tx">${esc(name(it))}</td><td class="c">${esc(m.c||'')}</td></tr>`;
  }
  // marks on items no longer in the list
  const known=new Set(b.items.filter(i=>!i.t).map(i=>i.id));
  for(const id in a.marks){if(id.startsWith(key+'.')&&!known.has(id)&&isDev(a.marks[id])){anyDev=true;const m=a.marks[id];out+=`<tr class="s${m.s}"><td class="st">${GL[m.s]}</td><td class="tx"><i>${t('removed')}</i> ${esc(id)}</td><td class="c">${esc(m.c||'')}</td></tr>`;}}
  return `<div class="blk"><h2>${t(key)}</h2>${anyDev?`<table class="rt ${mode==='full'?'dense':''}">${out}</table>`:`<div class="none">${t('noDev')}</div>`}</div>`;
}
function vReport(){
  const a=ana(),p=proj();if(!a)return vProject();
  const mode=state.ui.report;
  const dev=devCount(a);
  const blocks=BLOCKS.map(k=>reportBlock(a,k,mode)).join('');
  return `<div class="row noprint" style="margin-bottom:14px"><button data-go="analysis">← ${t('back')}</button><div class="grow"></div>
    <div class="seg"><button data-rep="exc" class="${mode==='exc'?'on':''}">${t('exceptions')}</button><button data-rep="full" class="${mode==='full'?'on':''}">${t('full')}</button></div>
    <button class="primary" onclick="window.print()">${t('print')}</button></div>
   <article class="rp ${mode==='full'?'full':''}">
    <h1>${t('appName')} — ${esc(p.name)}</h1>
    <dl class="rhead" style="margin-top:10px">
     <dt>${t('date')}</dt><dd>${esc(a.date||'')}</dd>
     <dt>${t('site')}</dt><dd>${esc(a.site||p.site||'')}</dd>
     <dt>${t('analyst')}</dt><dd>${esc(a.analyst||'')}</dd>
     <dt>${t('severity')}</dt><dd>${a.sev?esc(t('sev')[a.sev-1]):''}</dd>
     <dt>${t('kw')}</dt><dd>${esc(kwText(a))}</dd>
     <dt>${t('status')}</dt><dd>${t(a.status||'draft')} · ${dev} ${t('deviations').toLowerCase()}</dd>
     <dt>${t('description')}</dt><dd class="wide">${esc(a.description||'')}</dd>
     <dt>${t('lossDesc')}</dt><dd class="wide">${esc(a.lossDesc||'')}</dd>
    </dl>
    <div class="blocks">${blocks}</div>
    <div class="blk"><h2>${t('conclusions')}</h2><div class="concl">${esc(a.conclusions||'')||'<span class="muted">—</span>'}</div></div>
    <div class="foot"><span>${t('legend')}</span><span>${t('reportedOn')} ${today()}</span></div>
   </article>`;
}
function vSummary(){
  const p=proj();if(!p)return vProjects();
  const n=p.analyses.length;const counts={};
  for(const a of p.analyses)for(const id in a.marks)if(a.marks[id].s===1)counts[id]=(counts[id]||0)+1;
  let body='',any=false;
  for(const k of BLOCKS){const b=block(k);let rows='';for(const it of b.items){if(it.t)continue;const c=counts[it.id];if(!c)continue;any=true;rows+=`<tr><td class="num" style="width:60px">${c}</td><td>${esc(name(it))}</td></tr>`;}
    if(rows)body+=`<div class="blk"><h2>${t(k)}</h2><table class="rt dense">${rows}</table></div>`;}
  return `<div class="row noprint" style="margin-bottom:14px"><button data-go="project">← ${t('back')}</button><div class="grow"></div><button class="primary" onclick="window.print()">${t('print')}</button></div>
   <article class="rp"><h1>${t('summary')} — ${esc(p.name)}</h1><p class="muted">${t('timesMarked')} ${t('acrossN',{n})}</p>
   ${any?body:`<div class="none">${t('noMarks')}</div>`}
   <div class="foot"><span>${esc(p.site||'')}</span><span>${t('reportedOn')} ${today()}</span></div></article>`;
}
function taxText(b){return b.items.map(it=>it.t?`# ${it.en}${it.nl&&it.nl!==it.en?' | '+it.nl:''}`:`${it.en}${it.nl&&it.nl!==it.en?' | '+it.nl:''}`).join('\n');}
function kwTable(){const L=state.lang==='nl'?2:1;
  const col=(k)=>`<table class="list"><thead><tr><th>${t('kw'+k)}</th><th class="num">${k}</th></tr></thead><tbody>${KW[k].map(o=>`<tr><td>${esc(o[L])}</td><td class="num">${o[0]}</td></tr>`).join('')}</tbody></table>`;
  const cls=[['> 400',0],['200 – 400',1],['70 – 200',2],['20 – 70',3],['≤ 20',4]].map(c=>`<tr><td class="num" style="white-space:nowrap">${c[0]}</td><td>${esc(t('kwClass')[c[1]])}</td></tr>`).join('');
  return `<div class="kwgrid">${col('W')}${col('B')}${col('E')}<table class="list"><thead><tr><th class="num">R</th><th>${t('kwClassH')}</th></tr></thead><tbody>${cls}</tbody></table></div>`;}
function vSettings(){
  const areas=state.taxonomy.blocks.map(b=>`<label class="f"><span>${t(b.key)}</span><textarea data-tax="${b.key}" spellcheck="false">${esc(taxText(b))}</textarea></label>`).join('');
  return `<div class="stack">
   <div class="row"><h1 class="grow">${t('settings')}</h1></div>
   <h2>${t('langTitle')}</h2><div class="seg"><button data-lang="en" class="${state.lang==='en'?'on':''}">English</button><button data-lang="nl" class="${state.lang==='nl'?'on':''}">Nederlands</button></div>
   <h2>${t('dataTitle')}</h2><div class="row"><button data-export-all>${t('exportAll')}</button><button id="importBtn">${t('importFile')}</button><span class="small muted">${t('storage')}</span></div>
   <h2>${t('kw')}</h2>${kwTable()}
   <h2>${t('lists')}</h2><div class="help">${t('listsHelp')}</div>
   <div class="tax">${areas}</div>
   <div class="row"><button class="primary" id="saveTax">${t('saveLists')}</button><button id="resetTax">${t('resetLists')}</button></div>
  </div>`;
}

/* ---------- taxonomy editing ---------- */
function parseTax(key,text,old){
  const oldItems=old.items.filter(i=>!i.t);const used=new Set();
  const byEn=new Map();oldItems.forEach(i=>{if(!byEn.has(i.en))byEn.set(i.en,i);});
  let maxN=0;oldItems.forEach(i=>{const n=parseInt(i.id.split('.')[1]);if(n>maxN)maxN=n;});
  const items=[];let pos=0;
  for(let line of text.split('\n')){line=line.trim();if(!line)continue;
    if(line.startsWith('#')){const [en,nl]=line.slice(1).split('|').map(s=>s.trim());items.push({t:'g',en,nl:nl||en});continue;}
    const [en,nl]=line.split('|').map(s=>s.trim());
    let o=byEn.get(en);if(o&&used.has(o.id))o=null;
    if(!o){const cand=oldItems[pos];if(cand&&!used.has(cand.id)&&!byEnPending(byEn,cand,text))o=cand;}
    const id=o?o.id:key+'.'+(++maxN);used.add(id);
    items.push({id,en,nl:nl||en});pos++;}
  return {key,items};
}
// an old item whose EN text still appears later in the text should not be consumed by position
function byEnPending(byEn,cand,text){return text.split('\n').some(l=>l.trim().split('|')[0].trim()===cand.en);}
function saveTax(){
  const blocks=state.taxonomy.blocks.map(b=>parseTax(b.key,document.querySelector(`[data-tax="${b.key}"]`).value,b));
  state.taxonomy={ver:2,blocks};save();toast(t('listsSaved'));render();
}

/* ---------- import / export ---------- */
function download(name,obj){const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
const slug=s=>(s||'export').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function exportAll(){download(`soat-all-${today().replace(/-/g,'')}.json`,{app:'soat-scat',v:1,exportedAt:new Date().toISOString(),taxonomy:state.taxonomy,projects:state.projects});}
function exportProject(p){download(`soat-${slug(p.name)}-${today().replace(/-/g,'')}.json`,{app:'soat-scat',v:1,exportedAt:new Date().toISOString(),taxonomy:state.taxonomy,projects:[p]});}
function importJSON(text){
  let d;try{d=JSON.parse(text);}catch(e){toast(t('importErr'));return;}
  if(!d||d.app!=='soat-scat'||!Array.isArray(d.projects)){toast(t('importErr'));return;}
  let n=0;
  for(const p of d.projects){if(!p.id||!p.analyses)continue;
    const i=state.projects.findIndex(x=>x.id===p.id);
    if(i>=0){if(!confirm(t('replaceProject',{n:p.name})))continue;state.projects[i]=p;}else state.projects.push(p);n++;}
  if(d.taxonomy&&JSON.stringify(d.taxonomy)!==JSON.stringify(state.taxonomy)&&confirm(t('replaceTax')))state.taxonomy=d.taxonomy;
  save();toast(t('imported',{p:n}));render();
}

/* ---------- mutations ---------- */
function touch(){const p=proj();if(p)p.updated=new Date().toISOString();}
function newAnalysis(p){const a={id:uid(),date:today(),site:p.site||'',analyst:'',sev:0,status:'draft',description:'',lossDesc:'',conclusions:'',marks:{}};p.analyses.push(a);touch();save();return a;}
function setMark(id,patch){const a=ana();const m={...mark(a,id),...patch};if(m.s===0&&!(m.c&&m.c.trim()))delete a.marks[id];else a.marks[id]=m;touch();save();}
function updateRow(id){const a=ana();const m=mark(a,id);const el=document.querySelector(`.item[data-id="${id}"]`);if(!el)return;
  el.className=`item s${m.s} ${m.c&&m.c.trim()?'hc':''}`;el.querySelector('.st').textContent=GL[m.s];el.setAttribute('aria-pressed',m.s===1);
  const step=state.ui.step,c=blockCounts(a,step);const rb=document.querySelector(`.rail [data-step="${step}"] .cnt`);if(rb)rb.innerHTML=`<b>${c.m}</b>${c.c?' ✎'+c.c:''}<span class="muted">/${c.tot}</span>`;
  const bh=document.querySelector('.blockhead .muted');if(bh)bh.textContent=`${c.m} ${t('marked')} / ${c.tot}`;}
function cycle(id){const s=mark(ana(),id).s;setMark(id,{s:s?0:1});updateRow(id);}
function toggleComment(id,open){const w=document.querySelector(`[data-cw="${id}"]`);if(!w)return;const show=open??w.classList.contains('hidden');w.classList.toggle('hidden',!show);state.ui.openC=show?id:null;if(show){const ta=w.querySelector('textarea');ta.focus();ta.selectionStart=ta.value.length;}}

/* ---------- events ---------- */
const app=document.getElementById('app');
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-lang],[data-step],[data-rep],[data-open-p],[data-del-p],[data-open-a],[data-rep-a],[data-dup-a],[data-del-a],[data-export-p],[data-export-all],#newAna,#importBtn,#saveTax,#resetTax,.item,.cb');
  if(!b)return;const d=b.dataset;
  if(b.classList.contains('cb')){e.stopPropagation();toggleComment(d.c);return;}
  if(b.classList.contains('item')){cycle(d.id);b.focus();return;}
  if(d.lang){state.lang=d.lang;save();render();return;}
  if(d.go){if(d.go==='report')state.ui.openC=null;go(d.go);return;}
  if(d.step){state.ui.step=d.step;state.ui.openC=null;save();render();return;}
  if(d.rep){state.ui.report=d.rep;save();render();return;}
  if(d.openP){go('project',{pid:d.openP,aid:null});return;}
  if(d.delP){if(confirm(t('confirmDel'))){state.projects=state.projects.filter(p=>p.id!==d.delP);save();render();}return;}
  if(d.openA){go('analysis',{aid:d.openA,step:'details'});return;}
  if(d.repA){go('report',{aid:d.repA});return;}
  if(d.dupA){const p=proj();const src=p.analyses.find(a=>a.id===d.dupA);const c=JSON.parse(JSON.stringify(src));c.id=uid();c.date=today();c.status='draft';p.analyses.push(c);touch();save();render();return;}
  if(d.delA){if(confirm(t('confirmDel'))){const p=proj();p.analyses=p.analyses.filter(a=>a.id!==d.delA);touch();save();render();}return;}
  if(d.exportP){exportProject(state.projects.find(p=>p.id===d.exportP));return;}
  if(d.exportAll!==undefined){exportAll();return;}
  if(b.id==='newAna'){const a=newAnalysis(proj());go('analysis',{aid:a.id,step:'details'});return;}
  if(b.id==='importBtn'){document.getElementById('importFile').click();return;}
  if(b.id==='saveTax'){saveTax();return;}
  if(b.id==='resetTax'){if(confirm(t('confirmReset'))){state.taxonomy=starterTaxonomy();save();render();toast(t('listsSaved'));}return;}
});
app.addEventListener('submit',e=>{if(e.target.id==='newProj'){e.preventDefault();const f=new FormData(e.target);const p={id:uid(),name:f.get('name').trim(),site:(f.get('site')||'').trim(),created:new Date().toISOString(),updated:new Date().toISOString(),analyses:[]};if(!p.name)return;state.projects.push(p);go('project',{pid:p.id,aid:null});}});
app.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.f){const a=ana();if(!a)return;a[el.dataset.f]=/^(sev|kw[WBE])$/.test(el.dataset.f)?+el.value:el.value;touch();save();const o=document.getElementById('kwOut');if(o)o.textContent=kwText(a);return;}
  if(el.dataset.cm){setMark(el.dataset.cm,{c:el.value});updateRow(el.dataset.cm);return;}
});
app.addEventListener('change',e=>{if(e.target.dataset.f){const a=ana();if(a){a[e.target.dataset.f]=/^(sev|kw[WBE])$/.test(e.target.dataset.f)?+e.target.value:e.target.value;touch();save();const o=document.getElementById('kwOut');if(o)o.textContent=kwText(a);}}});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(importJSON);e.target.value='';});
app.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.dataset.cm){if(e.key==='Escape'){e.preventDefault();toggleComment(el.dataset.cm,false);document.querySelector(`.item[data-id="${el.dataset.cm}"]`)?.focus();}return;}
  if(!el.classList.contains('item'))return;
  const id=el.dataset.id;const rows=[...document.querySelectorAll('.item')];const i=rows.indexOf(el);
  const k=e.key;
  if(k==='ArrowDown'||k==='j'){e.preventDefault();rows[Math.min(i+1,rows.length-1)]?.focus();rows[Math.min(i+1,rows.length-1)]?.scrollIntoView({block:'nearest'});}
  else if(k==='ArrowUp'||k==='k'){e.preventDefault();rows[Math.max(i-1,0)]?.focus();rows[Math.max(i-1,0)]?.scrollIntoView({block:'nearest'});}
  else if(k===' '){e.preventDefault();const s=mark(ana(),id).s;setMark(id,{s:s===1?0:1});updateRow(id);}
  else if(k==='c'||k==='C'||k==='Enter'){e.preventDefault();toggleComment(id,true);}
  else if(k==='Escape'){el.blur();}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(state.ui.view!=='analysis')return;
  const order=['details',...BLOCKS,'conclusions'];const i=order.indexOf(state.ui.step);
  if(e.key==='ArrowRight'||e.key===']'){if(i<order.length-1){state.ui.step=order[i+1];state.ui.openC=null;save();render();}}
  else if(e.key==='ArrowLeft'||e.key==='['){if(i>0){state.ui.step=order[i-1];state.ui.openC=null;save();render();}}
});

/* print orientation: full report is dense and wide → landscape */
function setPrintOrientation(){let s=document.getElementById('pp');if(!s){s=document.createElement('style');s.id='pp';document.head.appendChild(s);}
  const land=state.ui.view==='report'&&state.ui.report==='full';s.textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:14mm 12mm}`;}

render();
</script>
