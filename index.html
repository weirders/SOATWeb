<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOAT / SCAT</title>
<style>
:root{
  --ink:#1B2430; --paper:#FFFFFF; --muted:#66707C; --line:#D8DDE3; --rail:#F2F4F6; --hover:#F7F8FA;
  --mark:#B45309; --mark-bg:#FBF1E6; --na:#8A929C; --note:#0F766E; --note-bg:#E8F4F2;
  --focus:#2563EB; --danger:#B91C1C;
  --fs:14px; --row:36px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--line);border-radius:4px;padding:5px 11px;background:var(--paper)}
button:hover{background:var(--hover)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#2c3746}
button.link{border:none;padding:2px 4px;color:var(--note);background:none}
button.danger{color:var(--danger)}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
input[type=text],input[type=date],select,textarea{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:64px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.25}
h1{font-size:18px}h2{font-size:16px}h3{font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

.top{display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:5}
.top .brand{font-weight:700;letter-spacing:.2px}
.top .crumbs{display:flex;gap:6px;align-items:center;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumbs span{opacity:.5}
.top .crumbs button.link{padding:0;color:var(--ink)}
.top .crumbs b{overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 10px}
.seg button.on{background:var(--ink);color:#fff}

main{padding:16px;max-width:1240px;margin:0 auto}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.grid2 .span{grid-column:1/-1}
label.f{display:block}
label.f>span{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.empty{padding:28px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center}

table.list{width:100%;border-collapse:collapse}
table.list th,table.list td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.list th{font-weight:600;font-size:12px;color:var(--muted)}
table.list tr.click{cursor:pointer}
table.list tr.click:hover{background:var(--hover)}
.num{text-align:right;font-variant-numeric:tabular-nums}

.an{display:grid;grid-template-columns:230px 1fr;gap:20px;align-items:start}
.rail{position:sticky;top:56px;background:var(--rail);border-radius:6px;padding:6px}
.rail button.rb{display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;border-radius:4px;padding:8px 10px;text-align:left}
.rail button.rb:hover{background:#fff}
.rail button.rb.on{background:#fff;box-shadow:0 0 0 1px var(--line)}
.rail .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rail .cnt b{color:var(--mark)}
.rail hr{border:none;border-top:1px solid var(--line);margin:6px 4px}
.rail .go{margin:6px 4px 2px;width:calc(100% - 8px)}
.blockhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.keys{font-size:12px;color:var(--muted)}

.items{border-top:1px solid var(--line)}
.grp{padding:14px 8px 4px;font-weight:600;font-size:13px;color:var(--ink)}
.grp.l3{padding:10px 8px 3px 16px;color:var(--muted)}
.grp.l4{padding:8px 8px 2px 24px;color:var(--muted);font-weight:500;font-style:italic}
.grp.l5{padding:6px 8px 2px 32px;color:var(--muted);font-weight:500;font-style:italic;font-size:12px}
.item{display:grid;grid-template-columns:44px 1fr 40px;align-items:center;min-height:var(--row);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.item:hover{background:var(--hover)}
.item .st{height:var(--row);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--na)}
.item .tx{padding:6px 6px 6px 0}
.item .cb{height:var(--row);display:flex;align-items:center;justify-content:center;color:var(--muted);opacity:.45}
.item:hover .cb{opacity:1}
.item.s1{background:var(--mark-bg)}
.item.s1 .st{color:var(--mark)}
.item.s1 .tx{font-weight:600}
.item.hc .cb{color:var(--note);opacity:1}
.fld{padding:8px 8px 10px;border-bottom:1px solid var(--line)}
.fld .opts{display:flex;flex-wrap:wrap;gap:6px 18px;padding:4px 0}
.fld .opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.fld .opts input{width:auto}
.kwf{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.kwf label.f>span{margin-top:6px}
.cmt{padding:4px 8px 10px 44px;border-bottom:1px solid var(--line);background:var(--note-bg)}
.cmt textarea{min-height:52px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{font-style:normal}

.rp{max-width:1100px}
.rp .rhead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.rp .rhead dt{color:var(--muted)}
.rp .rhead dd{margin:0}
.rp .rhead .wide{grid-column:1/-1;white-space:pre-wrap}
.rp h2{margin-top:18px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
table.rt{width:100%;border-collapse:collapse;font-size:13px}
table.rt td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.rt td.g{padding-top:8px;font-weight:600;border-bottom:1px solid var(--ink)}
table.rt td.g.l3{padding-left:14px;color:var(--muted);border-bottom-color:var(--line)}
table.rt td.g.l4,table.rt td.g.l5{padding-left:22px;color:var(--muted);font-weight:500;font-style:italic;border-bottom-color:var(--line)}
table.rt td.st{width:26px;text-align:center;font-size:15px}
table.rt td.c{width:40%;white-space:pre-wrap;color:#333}
table.rt tr.s1 td.st{color:var(--mark)}
table.rt tr.s1 td.tx{font-weight:600}
table.rt tr.s0 td{color:var(--na)}
table.rt tr.fr td.c{color:var(--ink)}
table.rt.dense td{padding:1px 5px;line-height:1.3}
.rp .none{padding:6px;color:var(--muted);font-style:italic}
.rp .concl{white-space:pre-wrap;border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.rp .foot{margin-top:18px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}

.qcard{border:1px solid var(--line);border-radius:6px;padding:12px}
.qcard textarea{min-height:320px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre;margin-top:8px}
.kwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;align-items:start;font-size:13px}
.help{background:var(--rail);padding:10px 12px;border-radius:6px;font-size:13px}
.help code{background:#fff;padding:0 4px;border-radius:3px}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:4px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

@media (max-width:760px){
  .an{grid-template-columns:1fr}
  .rail{position:static;display:flex;flex-wrap:wrap;gap:4px}
  .rail button.rb{width:auto;padding:6px 10px;gap:6px}
  .rail hr{display:none}
  .rail .go{width:auto;margin:0}
  .grid2,.kwf{grid-template-columns:1fr}
  .keys{display:none}
  main{padding:10px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  .top,.noprint,.toast{display:none!important}
  body{font-size:11.5px}
  main{padding:0;max-width:none}
  .rp .rhead{border-color:#999}
  .rp h2{break-after:avoid}
  .rp .blk{break-inside:avoid}
  table.rt td{border-bottom-color:#bbb}
  table.rt td.g{border-bottom-color:#000}
  .rp .foot{position:fixed;bottom:0;left:0;right:0}
  .rp.full .blocks{column-count:2;column-gap:10mm;column-fill:balance}
  .rp.full .blk{break-inside:auto}
  .rp.full table.rt tr{break-inside:avoid}
}
</style>
</head>

const t=(k,v)=>{let s=(I18N[state.lang]&&I18N[state.lang][k])??I18N.en[k]??k; if(v)for(const q in v)s=s.replace('{'+q+'}',v[q]); return s;};

/* ---------- questionnaire text format ----------
   "# EN | NL"  → block     "## EN | NL" → heading     "### …" → subheading (any depth)
   other lines  → question                                                        */
function parseQ(text,old){
  const oldItems=[];(old&&old.blocks||[]).forEach(b=>b.items.forEach(i=>{if(!i.t)oldItems.push(i);}));
  const qid=(old&&old.id)||uid();
  const used=new Set(),byEn=new Map();oldItems.forEach(i=>{if(!byEn.has(i.en))byEn.set(i.en,i);});
  const enLater=new Set(text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>l.split('|')[0].trim()));
  const blocks=[];let cur=null,pos=0;
  const ensure=()=>{if(!cur){cur={title:{en:t('general'),nl:t('general')},items:[]};blocks.push(cur);}};
  for(let line of text.split('\n')){line=line.trim();if(!line)continue;
    const m=line.match(/^(#+)\s*(.*)$/);
    if(m){const lvl=m[1].length;const [en,nl]=m[2].split('|').map(s=>s.trim());
      if(lvl===1){cur={title:{en,nl:nl||en},items:[]};blocks.push(cur);}
      else{ensure();cur.items.push({t:'g',lvl,en,nl:nl||en});}continue;}
    ensure();
    const om=line.match(/^-\s+(.*)$/);const last=cur.items[cur.items.length-1];
    if(om&&last&&!last.t&&(last.f==='select'||last.f==='multi')){const [oe,on]=om[1].split('|').map(s=>s.trim());last.opts.push({en:oe,nl:on||oe});continue;}
    let f=null;const fm=line.match(/^(.*?)\s*\[(text|textarea|date|number|select|multi|kinney)\]\s*$/i);if(fm){f=fm[2].toLowerCase();line=fm[1];}
    const [en,nl]=line.split('|').map(s=>s.trim());
    let o=byEn.get(en);if(o&&used.has(o.id))o=null;
    if(!o){const cand=oldItems[pos];if(cand&&!used.has(cand.id)&&!enLater.has(cand.en))o=cand;}
    let id=o?o.id:qid+'.'+hid(en);while(used.has(id))id+='x';used.add(id);
    const it={id,en,nl:nl||en};if(f){it.f=f;if(f==='select'||f==='multi')it.opts=[];}cur.items.push(it);pos++;}
  return {id:qid,name:(old&&old.name)||'',blocks};
}
function hid(str){let h=5381;for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return (h>>>0).toString(36);}
const enl=it=>it.en+(it.nl&&it.nl!==it.en?' | '+it.nl:'');
function qText(q){return q.blocks.map(b=>`# ${b.title.en}${b.title.nl&&b.title.nl!==b.title.en?' | '+b.title.nl:''}\n`+b.items.map(it=>it.t?'#'.repeat(it.lvl)+' '+enl(it):enl(it)+(it.f?' ['+it.f+']':'')+(it.opts?it.opts.map(o=>'\n- '+enl(o)).join(''):'')).join('\n')).join('\n\n');}
const isField=it=>!it.t&&!!it.f;
function qFields(q){return qItems(q).filter(isField);}
function qItems(q){const out=[];q.blocks.forEach(b=>b.items.forEach(i=>{if(!i.t)out.push(i);}));return out;}

/* ---------- built-in questionnaires ---------- */
const STARTERS={
 sat:{name:'SAT',text:`# Assessment | Beoordeling
Machine / installation | Machine / installatie [text]
Scope of the assessment | Reikwijdte van de beoordeling [textarea]

# General Requirements | Algemene Eisen
## Safety Management & Compliance | Veiligheidsmanagement en Compliance
Is the machine or modification covered by a documented risk assessment? | Is de machine of wijziging opgenomen in een gedocumenteerde risicobeoordeling?
Have identified risks been reduced according to the hierarchy of controls? | Zijn geïdentificeerde risico's gereduceerd volgens de arbeidshygiënische strategie?
Are legal requirements, standards and company SHE requirements known and complied with? | Zijn wettelijke eisen, normen en bedrijfs-SHE-eisen bekend en nageleefd?
Have management of change (MoC) requirements been completed before commissioning? | Zijn de eisen van Management of Change (MoC) afgerond vóór ingebruikname?
Have all residual risks been identified and communicated to users? | Zijn alle restrisico's geïdentificeerd en gecommuniceerd aan gebruikers?
Are workplace inspections and audits performed periodically? | Worden werkplekinspecties en audits periodiek uitgevoerd?
Are safety observations, incidents and near misses reported and followed up? | Worden veiligheidsobservaties, incidenten en bijna-ongevallen gemeld en opgevolgd?

# Machine Safety & Regulatory Compliance | Machineveiligheid en Wettelijke Compliance
## CE Marking & Documentation | CE-markering en Documentatie
Is a valid Declaration of Conformity available? | Is een geldige Verklaring van Overeenstemming beschikbaar?
Is the CE marking clearly visible and legible? | Is de CE-markering duidelijk zichtbaar en leesbaar?
Is the machine identification plate present and complete? | Is het machine-identificatieplaatje aanwezig en volledig?
Are operating instructions available in the local language? | Zijn gebruiksinstructies beschikbaar in de lokale taal?
Is the technical file available and up to date? | Is het technisch dossier beschikbaar en actueel?
Have all modifications been assessed for their impact on CE compliance? | Zijn alle wijzigingen beoordeeld op hun invloed op CE-conformiteit?
Have significant modifications been evaluated as possible new machinery? | Zijn ingrijpende wijzigingen beoordeeld als mogelijke nieuwe machine?
## Machine Regulation (EU) 2023/1230 | Machineverordening (EU) 2023/1230
Has cybersecurity been evaluated where safety-related functions depend on software or connectivity? | Is cybersecurity beoordeeld wanneer veiligheidsfuncties afhankelijk zijn van software of connectiviteit?

function kwScoreV(v){if(!v||!v.w||!v.b||!v.e)return null;const r=v.w*v.b*v.e;const cls=r>400?0:r>200?1:r>70?2:r>20?3:4;return {r:Math.round(r*10)/10,cls};}
function kwScore(a){return kwScoreV(kwVal(a));}
function kwTextV(v){const k=kwScoreV(v);return k?`${v.w} × ${v.b} × ${v.e} = ${k.r} · ${t('kwClass')[k.cls]}`:t('kwNone');}

/* ---------- state ---------- */
const uid=()=>(SYNC&&SYNC.util&&SYNC.util.uid)?SYNC.util.uid():Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>new Date().toISOString().slice(0,10);
function fresh(){return {v:4,lang:'en',questionnaires:[],projects:[],ui:{view:'projects',pid:null,aid:null,step:'details',report:'exc'}};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v>=1&&s.v<=4)return s;}catch(e){}return null;}
let state=load()||fresh();
migrate();
function migrate(){
  if(state.v===1){ // v1: fixed five blocks under state.taxonomy → one SOAT questionnaire, ids preserved
    const titles={loss:['Loss','Verlies'],contact:['Contact / energy exchange','Contact / energie-uitwisseling'],immediate:['Immediate causes','Directe oorzaken'],basic:['Basic causes','Basisoorzaken'],control:['Control actions','Beheersmaatregelen']};
    const tax=state.taxonomy||{blocks:[]};
    const q={id:'soat',name:'SOAT',blocks:tax.blocks.map(b=>({title:{en:titles[b.key]?.[0]||b.key,nl:titles[b.key]?.[1]||b.key},items:b.items.map(i=>i.t?{t:'g',lvl:2,en:i.en,nl:i.nl}:i)}))};
    state.questionnaires=[q];delete state.taxonomy;
    for(const p of state.projects)for(const a of p.analyses){a.qid='soat';delete a.sev;for(const id in a.marks)if(a.marks[id].s===2)a.marks[id].s=0;}
    state.v=2;state.ui.step='details';
  }
  if(state.v===2){ // v2 → v3: description / loss / K&W move into an Incident form block at the start of every questionnaire
    for(const q of state.questionnaires){
      let maxN=0;qItems(q).forEach(i=>{const n=parseInt(String(i.id).split('.').pop());if(n>maxN)maxN=n;});
      const ids=[q.id+'.'+(maxN+1),q.id+'.'+(maxN+2),q.id+'.'+(maxN+3)];q._mig=ids;
      q.blocks.unshift({title:{en:'Incident',nl:'Incident'},items:[{id:ids[0],en:'What happened',nl:'Wat is er gebeurd',f:'textarea'},{id:ids[1],en:'Actual loss',nl:'Werkelijk verlies',f:'textarea'},{id:ids[2],en:'Risk',nl:'Risico',f:'kinney'}]});}
    for(const p of state.projects)for(const a of p.analyses){a.vals=a.vals||{};const q=state.questionnaires.find(x=>x.id===a.qid);
      if(q&&q._mig){if(a.description)a.vals[q._mig[0]]=a.description;if(a.lossDesc)a.vals[q._mig[1]]=a.lossDesc;if(a.kwW||a.kwB||a.kwE)a.vals[q._mig[2]]={w:a.kwW||0,b:a.kwB||0,e:a.kwE||0};}
      delete a.description;delete a.lossDesc;delete a.kwW;delete a.kwB;delete a.kwE;}
    state.questionnaires.forEach(q=>delete q._mig);state.v=3;
  }
  if(state.v===3){remapAll();if(!state.synced)addMissingStarters();state.v=4;}
  if(!state.questionnaires.length&&!SYNC)state.questionnaires=allStarters();
  for(const p of state.projects)for(const a of p.analyses)a.vals=a.vals||{};
  save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(SYNC?{v:3,lang:state.lang,ui:state.ui,questionnaires:[],projects:[],synced:true}:state));}catch(e){toast('Storage error: '+e.message);}}

/* ---------- sfha-sync persistence (DB is the source of truth when SYNC is present) ---------- */
const own=new Set();const QREC=q=>APP+'.q.'+q.id;
const pPayload=p=>({id:p.id,name:p.name,site:p.site,created:p.created,lastQ:p.lastQ});
async function pQ(q){save();if(!SYNC)return;own.add(QREC(q));await SYNC.put(APP,'questionnaires',{id:QREC(q),payload:q});}
async function dQ(q){save();if(!SYNC)return;own.add(QREC(q));await SYNC.del(APP,'questionnaires',QREC(q));}
async function pP(p){save();if(!SYNC)return;own.add(p.id);await SYNC.put(APP,'projects',{id:p.id,payload:pPayload(p)});}
async function dP(p){save();if(!SYNC)return;own.add(p.id);await SYNC.del(APP,'projects',p.id);for(const a of p.analyses){own.add(a.id);await SYNC.del(APP,'analyses',a.id);}}
const aTimers={};
function pA(a,pid,now){save();if(!SYNC)return;a.pid=pid||a.pid;const f=async()=>{delete aTimers[a.id];own.add(a.id);await SYNC.put(APP,'analyses',{id:a.id,payload:a});};
  clearTimeout(aTimers[a.id]);if(now)f();else aTimers[a.id]=setTimeout(f,400);}
async function dA(a){save();if(!SYNC)return;clearTimeout(aTimers[a.id]);own.add(a.id);await SYNC.del(APP,'analyses',a.id);}
async function loadFromSync(){
  const qs=await SYNC.list(APP,'questionnaires'),ps=await SYNC.list(APP,'projects'),as=await SYNC.list(APP,'analyses');
  state.questionnaires=qs.map(r=>r.payload);
  const byP={};state.projects=ps.map(r=>{const p={...r.payload,analyses:[],updated:r.updatedAt};byP[p.id]=p;return p;});
  for(const r of as){const a=r.payload;a._u=r.updatedAt;const p=byP[a.pid];if(!p)continue;p.analyses.push(a);if(r.updatedAt>p.updated)p.updated=r.updatedAt;}
  if(!state.questionnaires.length){state.questionnaires=allStarters();for(const q of state.questionnaires)await pQ(q);}
  for(const p of state.projects)for(const a of p.analyses)a.vals=a.vals||{};
}
let pendingRender=false;
function onRemoteChange(ch){
  if(ch.app!==APP||!ch.ids||!ch.ids.length)return;
  if(ch.ids.every(id=>own.has(id))){ch.ids.forEach(id=>own.delete(id));return;}
  ch.ids.forEach(id=>own.delete(id));
  loadFromSync().then(()=>{const el=document.activeElement;
    if(el&&['INPUT','TEXTAREA','SELECT'].includes(el.tagName)&&el.closest('#app')){if(!pendingRender){pendingRender=true;el.addEventListener('blur',()=>{pendingRender=false;render();},{once:true});}return;}
    render();toast(t('synced'));});
}
async function boot(){
  if(SYNC){
    await SYNC.init({app:APP});
    const local=state; // whatever localStorage held before this device joined sync
    await SYNC.migrate('v1',async()=>{
      if(local.synced)return;const old=new Date(0).toISOString();
      for(const q of local.questionnaires)await SYNC.put(APP,'questionnaires',{id:QREC(q),payload:q,updatedAt:old},{keepStamp:true,silent:true});
      for(const p of local.projects){const st=p.updated||old;await SYNC.put(APP,'projects',{id:p.id,payload:pPayload(p),updatedAt:st},{keepStamp:true,silent:true});
        for(const a of p.analyses){a.pid=p.id;await SYNC.put(APP,'analyses',{id:a.id,payload:a,updatedAt:st},{keepStamp:true,silent:true});}}
    });
    await loadFromSync();
    await SYNC.migrate('v2-stable-ids',async()=>{ // numeric item ids → content-stable ids, re-put everything so all devices converge
      remapAll();addMissingStarters();
      for(const q of state.questionnaires)await pQ(q);
      for(const p of state.projects)for(const a of p.analyses)pA(a,p.id,true);
    });
    SYNC.onChange(onRemoteChange);
    if(SYNC.onStatus)SYNC.onStatus(()=>{const el=document.getElementById('syncdot');if(el)el.textContent=syncLabel();});
    window.addEventListener('beforeunload',()=>{for(const id in aTimers){clearTimeout(aTimers[id]);}});
    window.addEventListener('pagehide',flushNow);
  }
  save();render();
}
function flushNow(){for(const id in aTimers){clearTimeout(aTimers[id]);delete aTimers[id];for(const p of state.projects){const a=p.analyses.find(x=>x.id===id);if(a){own.add(a.id);SYNC.put(APP,'analyses',{id:a.id,payload:a});}}}}
async function wipeAll(){
  if(SYNC){for(const coll of ['questionnaires','projects','analyses']){const recs=await SYNC.list(APP,coll);for(const r of recs){own.add(r.id);await SYNC.del(APP,coll,r.id);}}}
  state.projects=[];state.questionnaires=allStarters();state.ui={view:'projects',pid:null,aid:null,step:'details',report:'exc'};
  if(SYNC)for(const q of state.questionnaires)await pQ(q);save();render();toast(t('saved'));}
function syncLabel(){if(!SYNC)return '';try{const s=SYNC.status();const n=(s.connections||[]).length;return (s.leaderPresent||s.leader?'●':'○')+(n?' '+n:'');}catch(e){return '';}}
const proj=()=>state.projects.find(p=>p.id===state.ui.pid);
const ana=()=>{const p=proj();return p&&p.analyses.find(a=>a.id===state.ui.aid);};
const qOf=a=>state.questionnaires.find(q=>q.id===a.qid)||{id:a.qid,name:'?',blocks:[]};
const name=it=>(state.lang==='nl'&&it.nl)?it.nl:it.en;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mark=(a,id)=>a.marks[id]||{s:0,c:''};
const isDev=m=>m.s===1||!!(m.c&&m.c.trim());
const GL=['–','●'];

function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600);}
function go(view,extra){Object.assign(state.ui,{view},extra||{});save();render();window.scrollTo(0,0);}

/* ---------- counts ---------- */
const hasVal=v=>v!==undefined&&v!==null&&v!==''&&!(Array.isArray(v)&&!v.length)&&!(typeof v==='object'&&!Array.isArray(v)&&!(v.w||v.b||v.e));
function blockCounts(a,b){let m=0,c=0,tot=0;for(const it of b.items){if(it.t)continue;tot++;if(it.f){if(hasVal(a.vals[it.id]))m++;continue;}const k=mark(a,it.id);if(k.s===1)m++;if(k.c&&k.c.trim())c++;}return {m,c,tot};}
function devCount(a){return Object.values(a.marks).filter(isDev).length;}
function cntHtml(c){return `<b>${c.m}</b>${c.c?' ✎'+c.c:''}<span class="muted">/${c.tot}</span>`;}

/* ---------- render ---------- */
function render(){renderTop();const v=state.ui.view;const app=document.getElementById('app');
  app.innerHTML=v==='projects'?vProjects():v==='project'?vProject():v==='analysis'?vAnalysis():v==='report'?vReport():v==='summary'?vSummary():vSettings();
  document.documentElement.lang=state.lang;setPrintOrientation();}
function renderTop(){
  const p=proj(),a=ana();
  let crumbs=`<button class="link" data-go="projects">${t('projects')}</button>`;
  if(p&&state.ui.view!=='projects')crumbs+=`<span>›</span><button class="link" data-go="project"><b>${esc(p.name)}</b></button>`;
  if(a&&(state.ui.view==='analysis'||state.ui.view==='report'))crumbs+=`<span>›</span><b>${esc(a.date||'')} ${esc(short(aTitle(a))||t('untitled'))}</b>`;
  if(state.ui.view==='summary')crumbs+=`<span>›</span><b>${t('summary')}</b>`;
  if(state.ui.view==='settings')crumbs+=`<span>›</span><b>${t('settings')}</b>`;
  document.getElementById('top').innerHTML=`<div class="brand">${t('appName')}</div><div class="crumbs">${crumbs}</div>
   <div class="seg"><button data-lang="en" class="${state.lang==='en'?'on':''}">EN</button><button data-lang="nl" class="${state.lang==='nl'?'on':''}">NL</button></div>
   ${SYNC?`<button data-sync title="${t('sync')}">⇄ <span id="syncdot">${syncLabel()}</span></button>`:''}<button data-go="settings" title="${t('settings')}">⚙</button>`;
}
const aTitle=a=>{for(const f of qFields(qOf(a)))if((f.f==='text'||f.f==='textarea')&&a.vals[f.id])return String(a.vals[f.id]);return '';};
const short=(s,n=48)=>{s=(s||'').trim().split('\n')[0];return s.length>n?s.slice(0,n-1)+'…':s;};

function vProjects(){
  const rows=state.projects.slice().sort((x,y)=>(y.updated||'').localeCompare(x.updated||'')).map(p=>`<tr class="click" data-open-p="${p.id}"><td><b>${esc(p.name)}</b></td><td>${esc(p.site||'')}</td><td class="num">${p.analyses.length}</td><td class="muted">${esc((p.updated||'').slice(0,10))}</td><td class="num"><button class="link danger" data-del-p="${p.id}">${t('del')}</button></td></tr>`).join('');
  return `<div class="stack">
   <h1>${t('projects')}</h1>
   <form id="newProj" class="row" autocomplete="off"><input type="text" name="name" placeholder="${t('projectName')}" required style="max-width:280px"><input type="text" name="site" placeholder="${t('site')}" style="max-width:240px"><button class="primary">${t('newProject')}</button></form>
   ${state.projects.length?`<table class="list"><thead><tr><th>${t('projectName')}</th><th>${t('site')}</th><th class="num">${t('analyses')}</th><th>${t('updated')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t('noProjects')}</div>`}
   <p class="small muted">${t('storage')}</p></div>`;
}

function vProject(){
  const p=proj();if(!p)return vProjects();
  const multiQ=state.questionnaires.length>1;
  const rows=p.analyses.slice().sort((x,y)=>(y.date||'').localeCompare(x.date||'')).map(a=>{const k=kwScore(a);return `<tr class="click" data-open-a="${a.id}">
    <td style="white-space:nowrap">${esc(a.date||'')}</td><td>${esc(short(aTitle(a),70))||'<span class="muted">'+t('untitled')+'</span>'}</td>${multiQ?`<td>${esc(qOf(a).name)}</td>`:''}<td class="num">${k?k.r:''}</td>
    <td>${t(a.status||'draft')}</td><td class="num">${devCount(a)}</td>
    <td class="num" style="white-space:nowrap"><button class="link" data-rep-a="${a.id}">${t('report')}</button> <button class="link" data-dup-a="${a.id}">${t('duplicate')}</button> <button class="link danger" data-del-a="${a.id}">${t('del')}</button></td></tr>`;}).join('');
  const qsel=multiQ?`<select id="newQsel" style="width:auto">${state.questionnaires.map(q=>`<option value="${q.id}" ${q.id===p.lastQ?'selected':''}>${esc(q.name)}</option>`).join('')}</select>`:'';
  return `<div class="stack">
   <div class="row"><div class="grow"><h1>${esc(p.name)}</h1><div class="muted">${esc(p.site||'')}</div></div><button data-go="summary">${t('summary')}</button><button data-export-p="${p.id}">${t('exportProject')}</button>${qsel}<button class="primary" id="newAna">${t('newAnalysis')}</button></div>
   ${p.analyses.length?`<table class="list"><thead><tr><th>${t('date')}</th><th>${t('title')}</th>${multiQ?`<th>${t('questionnaire')}</th>`:''}<th class="num">R</th><th>${t('status')}</th><th class="num">${t('deviations')}</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t('noAnalyses')}</div>`}
  </div>`;
}

function stepOrder(q){return ['details',...q.blocks.map((_,i)=>'b'+i),'conclusions'];}
function vAnalysis(){
  const a=ana();if(!a)return vProject();const q=qOf(a);
  const step=state.ui.step;
  const railBtn=(k,label,cnt)=>`<button class="rb ${step===k?'on':''}" data-step="${k}"><span>${label}</span><span class="cnt">${cnt??''}</span></button>`;
  let rail=railBtn('details',t('details'));
  q.blocks.forEach((b,i)=>{rail+=railBtn('b'+i,esc(name(b.title)),cntHtml(blockCounts(a,b)));});
  rail+=railBtn('conclusions',t('conclusions'),a.conclusions?'✎':'');
  rail+=`<hr><button class="go primary" data-go="report">${t('goReport')}</button>`;
  let main;
  if(step==='details')main=vDetails(a,q);
  else if(step==='conclusions')main=`<h2>${t('conclusions')}</h2><textarea data-f="conclusions" rows="12" placeholder="${t('conclPh')}" style="margin-top:10px">${esc(a.conclusions||'')}</textarea>`;
  else{const b=q.blocks[+step.slice(1)];main=b?vBlock(a,b):vDetails(a,q);}
  return `<div class="an"><nav class="rail">${rail}</nav><section>${main}</section></div>`;
}
function vDetails(a,q){
  return `<h2>${t('details')} <span class="muted small">· ${esc(q.name)}</span></h2><div class="grid2" style="margin-top:10px">
   <label class="f"><span>${t('date')}</span><input type="date" data-f="date" value="${esc(a.date||'')}"></label>
   <label class="f"><span>${t('site')}</span><input type="text" data-f="site" value="${esc(a.site||'')}"></label>
   <label class="f"><span>${t('analyst')}</span><input type="text" data-f="analyst" value="${esc(a.analyst||'')}"></label>
   <label class="f"><span>${t('status')}</span><select data-f="status"><option value="draft" ${a.status!=='final'?'selected':''}>${t('draft')}</option><option value="final" ${a.status==='final'?'selected':''}>${t('final')}</option></select></label>
  </div>`;
}
function itemRow(a,it){
  const m=mark(a,it.id),open=state.ui.openC===it.id;
  return `<div class="item s${m.s} ${m.c&&m.c.trim()?'hc':''}" tabindex="0" data-id="${it.id}" role="button" aria-pressed="${m.s===1}">
    <span class="st">${GL[m.s]}</span><span class="tx">${esc(name(it))}</span><span class="cb" data-c="${it.id}" title="${t('comment')}">✎</span></div>
   <div class="cmt ${open?'':'hidden'}" data-cw="${it.id}"><textarea data-cm="${it.id}" placeholder="${t('commentPh')}">${esc(m.c||'')}</textarea></div>`;
}
function optLabel(it,en){const o=(it.opts||[]).find(x=>x.en===en);return o?name(o):en;}
function valText(it,v){if(!hasVal(v))return '';if(it.f==='kinney')return kwTextV(v);if(it.f==='multi')return v.map(x=>optLabel(it,x)).join(', ');if(it.f==='select')return optLabel(it,v);return String(v);}
function fieldRow(a,it){const v=a.vals[it.id];const id=it.id;let inp;
  if(it.f==='text')inp=`<input type="text" data-fv="${id}" value="${esc(v||'')}">`;
  else if(it.f==='date')inp=`<input type="date" data-fv="${id}" value="${esc(v||'')}">`;
  else if(it.f==='number')inp=`<input type="number" data-fv="${id}" value="${esc(v??'')}" style="max-width:200px">`;
  else if(it.f==='textarea')inp=`<textarea data-fv="${id}">${esc(v||'')}</textarea>`;
  else if(it.f==='select')inp=`<select data-fv="${id}"><option value="">—</option>${(it.opts||[]).map(o=>`<option value="${esc(o.en)}" ${v===o.en?'selected':''}>${esc(name(o))}</option>`).join('')}</select>`;
  else if(it.f==='multi')inp=`<div class="opts">${(it.opts||[]).map(o=>`<label><input type="checkbox" data-fmv="${id}" value="${esc(o.en)}" ${Array.isArray(v)&&v.includes(o.en)?'checked':''}> ${esc(name(o))}</label>`).join('')}</div>`;
  else if(it.f==='kinney'){const k=v||{};inp=`<div class="kwf">${['w','b','e'].map(x=>`<label class="f"><span>${t('kw'+x.toUpperCase())}</span><select data-fk="${id}" data-k="${x}"><option value="0">—</option>${KW[x.toUpperCase()].map(o=>`<option value="${o[0]}" ${k[x]===o[0]?'selected':''}>${o[0]} · ${state.lang==='nl'?o[2]:o[1]}</option>`).join('')}</select></label>`).join('')}<label class="f"><span>${t('kwR')}</span><div class="kwout" data-kwout="${id}" style="padding:6px 0;font-weight:600">${kwTextV(k)}</div></label></div>`;}
  return `<div class="fld"><label class="f"><span>${esc(name(it))}</span>${inp}</label></div>`;}
function vBlock(a,b){
  const c=blockCounts(a,b);
  const rows=b.items.map(it=>it.t?`<div class="grp l${Math.min(it.lvl,5)}">${esc(name(it))}</div>`:it.f?fieldRow(a,it):itemRow(a,it)).join('');
  const hasChecks=b.items.some(it=>!it.t&&!it.f);
  return `<div class="blockhead"><h2>${esc(name(b.title))}</h2><span class="muted" id="bcount">${c.m} ${t('marked')} / ${c.tot}</span></div>
   ${hasChecks?`<div class="keys">${t('keys')}</div>`:''}<div class="items" id="items">${rows}</div>
   ${hasChecks?`<div class="legend"><i>${t('legend')}</i></div>`:''}`;
}

/* ---------- reports ---------- */
function reportBlock(a,b,mode){
  let out='',any=false,pending=[];
  for(const it of b.items){
    if(it.t){const h=`<tr><td class="g l${Math.min(it.lvl,5)}" colspan="3">${esc(name(it))}</td></tr>`;
      if(mode==='full'){out+=h;}else{pending=pending.filter(p=>p.lvl<it.lvl);pending.push({lvl:it.lvl,h});}continue;}
    if(it.f){const v=a.vals[it.id];if(mode==='exc'&&!hasVal(v))continue;
      if(pending.length){out+=pending.map(p=>p.h).join('');pending=[];}
      any=true;out+=`<tr class="fr"><td class="st"></td><td class="tx">${esc(name(it))}</td><td class="c">${esc(valText(it,v))||'<span class="muted">—</span>'}</td></tr>`;continue;}
    const m=mark(a,it.id);if(mode==='exc'&&!isDev(m))continue;
    if(pending.length){out+=pending.map(p=>p.h).join('');pending=[];}
    any=true;out+=`<tr class="s${m.s}"><td class="st">${GL[m.s]}</td><td class="tx">${esc(name(it))}</td><td class="c">${esc(m.c||'')}</td></tr>`;}
  return `<div class="blk"><h2>${esc(name(b.title))}</h2>${any?`<table class="rt ${mode==='full'?'dense':''}">${out}</table>`:`<div class="none">${t('noDev')}</div>`}</div>`;
}
function removedBlock(a,q){
  const known=new Set(qItems(q).map(i=>i.id));let out='';
  for(const id in a.marks)if(!known.has(id)&&isDev(a.marks[id])){const m=a.marks[id];out+=`<tr class="s${m.s}"><td class="st">${GL[m.s]}</td><td class="tx"><i>${t('removedOne')}</i> ${esc(id)}</td><td class="c">${esc(m.c||'')}</td></tr>`;}
  return out?`<div class="blk"><h2>${t('removed')}</h2><table class="rt">${out}</table></div>`:'';
}
function rHead(a,p,q){const dev=devCount(a);return `<dl class="rhead" style="margin-top:10px">
     <dt>${t('questionnaire')}</dt><dd>${esc(q.name)}</dd>
     <dt>${t('date')}</dt><dd>${esc(a.date||'')}</dd>
     <dt>${t('site')}</dt><dd>${esc(a.site||p.site||'')}</dd>
     <dt>${t('analyst')}</dt><dd>${esc(a.analyst||'')}</dd>
     <dt>${t('status')}</dt><dd>${t(a.status||'draft')} · ${dev} ${t('deviations').toLowerCase()}</dd></dl>`;}
function vReport(){
  const a=ana(),p=proj();if(!a)return vProject();const q=qOf(a);const mode=state.ui.report;
  return `<div class="row noprint" style="margin-bottom:14px"><button data-go="analysis">← ${t('back')}</button><div class="grow"></div>
    <div class="seg"><button data-rep="exc" class="${mode==='exc'?'on':''}">${t('exceptions')}</button><button data-rep="full" class="${mode==='full'?'on':''}">${t('full')}</button></div>
    <button class="primary" onclick="window.print()">${t('print')}</button></div>
   <article class="rp ${mode==='full'?'full':''}">
    <h1>${esc(q.name)} — ${esc(p.name)}</h1>${rHead(a,p,q)}
    <div class="blocks">${q.blocks.map(b=>reportBlock(a,b,mode)).join('')}${removedBlock(a,q)}</div>
    <div class="blk"><h2>${t('conclusions')}</h2><div class="concl">${esc(a.conclusions||'')||'<span class="muted">—</span>'}</div></div>
    <div class="foot"><span>${t('legend')}</span><span>${t('reportedOn')} ${today()}</span></div>
   </article>`;
}
function vSummary(){
  const p=proj();if(!p)return vProjects();
  const n=p.analyses.length;const counts={};
  for(const a of p.analyses){for(const id in a.marks)if(a.marks[id].s===1)counts[id]=(counts[id]||0)+1;
    for(const id in a.vals){const v=a.vals[id];(Array.isArray(v)?v:typeof v==='string'?[v]:[]).forEach(x=>{counts[id+'::'+x]=(counts[id+'::'+x]||0)+1;});}}
  let body='',any=false;
  for(const q of state.questionnaires){let qb='';
    for(const b of q.blocks){let rows='';for(const it of b.items){if(it.t)continue;
        if(it.f){if(it.f!=='select'&&it.f!=='multi')continue;for(const o of it.opts||[]){const c=counts[it.id+'::'+o.en];if(!c)continue;any=true;rows+=`<tr><td class="num" style="width:60px">${c}</td><td>${esc(name(it))} · ${esc(name(o))}</td></tr>`;}continue;}
        const c=counts[it.id];if(!c)continue;any=true;rows+=`<tr><td class="num" style="width:60px">${c}</td><td>${esc(name(it))}</td></tr>`;}
      if(rows)qb+=`<div class="blk"><h2>${esc(name(b.title))}</h2><table class="rt dense">${rows}</table></div>`;}
    if(qb)body+=(state.questionnaires.length>1?`<h1 style="margin-top:22px">${esc(q.name)}</h1>`:'')+qb;}
  return `<div class="row noprint" style="margin-bottom:14px"><button data-go="project">← ${t('back')}</button><div class="grow"></div><button class="primary" onclick="window.print()">${t('print')}</button></div>
   <article class="rp"><h1>${t('summary')} — ${esc(p.name)}</h1><p class="muted">${t('timesMarked')} ${t('acrossN',{n})}</p>
   ${any?body:`<div class="none">${t('noMarks')}</div>`}
   <div class="foot"><span>${esc(p.site||'')}</span><span>${t('reportedOn')} ${today()}</span></div></article>`;
}

/* ---------- settings ---------- */
function kwTable(){const L=state.lang==='nl'?2:1;
  const col=k=>`<table class="list"><thead><tr><th>${t('kw'+k)}</th><th class="num">${k}</th></tr></thead><tbody>${KW[k].map(o=>`<tr><td>${esc(o[L])}</td><td class="num">${o[0]}</td></tr>`).join('')}</tbody></table>`;
  const cls=[['> 400',0],['200 – 400',1],['70 – 200',2],['20 – 70',3],['≤ 20',4]].map(c=>`<tr><td class="num" style="white-space:nowrap">${c[0]}</td><td>${esc(t('kwClass')[c[1]])}</td></tr>`).join('');
  return `<div class="kwgrid">${col('W')}${col('B')}${col('E')}<table class="list"><thead><tr><th class="num">R</th><th>${t('kwClassH')}</th></tr></thead><tbody>${cls}</tbody></table></div>`;}
function vSettings(){
  const cards=state.questionnaires.map(q=>`<div class="qcard" data-q="${q.id}">
    <div class="row"><label class="f grow" style="max-width:360px"><span>${t('qName')}</span><input type="text" data-qname="${q.id}" value="${esc(q.name)}"></label>
     <span class="small muted">${qItems(q).length} items · ${q.blocks.length} ${state.lang==='nl'?'blokken':'blocks'}</span><div class="grow"></div>
     <button class="primary" data-qsave="${q.id}">${t('save')}</button>${STARTERS[q.id]?`<button data-qrestore="${q.id}">${t('restoreQ')}</button>`:''}<button class="danger" data-qdel="${q.id}">${t('del')}</button></div>
    <textarea data-qtext="${q.id}" spellcheck="false">${esc(qText(q))}</textarea></div>`).join('');
  return `<div class="stack">
   <h1>${t('settings')}</h1>
   <h2>${t('langTitle')}</h2><div class="seg"><button data-lang="en" class="${state.lang==='en'?'on':''}">English</button><button data-lang="nl" class="${state.lang==='nl'?'on':''}">Nederlands</button></div>
   <h2>${t('dataTitle')}</h2><div class="row"><button data-export-all>${t('exportAll')}</button><button id="importBtn">${t('importFile')}</button>${SYNC?`<button data-sync>⇄ ${t('sync')}</button>`:''}<button class="danger" data-wipe>${t('wipe')}</button><span class="small muted">${SYNC?t('syncSame'):t('storage')}</span></div>
   <h2>${t('kw')}</h2>${kwTable()}
   <div class="row"><h2 class="grow">${t('questionnaires')}</h2><button id="addQ">${t('addQ')}</button>${Object.keys(STARTERS).filter(k=>!state.questionnaires.some(q=>q.id===k)).map(k=>`<button data-qrestore="${k}">${t('restoreQ')} ${STARTERS[k].name}</button>`).join('')}</div>
   <div class="help">${t('qHelp')}</div>
   ${cards}
  </div>`;
}
function saveQ(id){const i=state.questionnaires.findIndex(q=>q.id===id);if(i<0)return;const old=state.questionnaires[i];
  const q=parseQ(document.querySelector(`[data-qtext="${id}"]`).value,old);q.name=document.querySelector(`[data-qname="${id}"]`).value.trim()||old.name;
  state.questionnaires[i]=q;pQ(q);toast(t('saved'));render();}

/* ---------- import / export ---------- */
function download(fname,obj){const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=fname;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);}
const slug=s=>(s||'export').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const stamp=()=>today().replace(/-/g,'');
function exportAll(){download(`soat-all-${stamp()}.json`,{app:'soat-scat',v:3,exportedAt:new Date().toISOString(),questionnaires:state.questionnaires,projects:state.projects});}
function exportProject(p){const used=new Set(p.analyses.map(a=>a.qid));download(`soat-${slug(p.name)}-${stamp()}.json`,{app:'soat-scat',v:3,exportedAt:new Date().toISOString(),questionnaires:state.questionnaires.filter(q=>used.has(q.id)),projects:[p]});}
function importJSON(text){
  let d;try{d=JSON.parse(text);}catch(e){toast(t('importErr'));return;}
  if(!d||d.app!=='soat-scat'||!Array.isArray(d.projects)){toast(t('importErr'));return;}
  if(d.v===1||d.v===2){ // convert an older export in place using the same migration
    const s=state;state={v:d.v,lang:s.lang,taxonomy:d.taxonomy,questionnaires:d.questionnaires||[],projects:d.projects,ui:s.ui};migrate();d={questionnaires:state.questionnaires,projects:state.projects};state=s;}
  let n=0;
  const maps={};
  for(const q0 of d.questionnaires||[]){const i=state.questionnaires.findIndex(x=>x.id===q0.id);
    if(i<0){const r=remapQ(q0);maps[q0.id]=r.map;state.questionnaires.push(r.q);pQ(r.q);continue;}
    const loc=state.questionnaires[i];const byEn=new Map();qItems(loc).forEach(it=>{if(!byEn.has(it.en))byEn.set(it.en,it.id);});
    const map={};qItems(q0).forEach(it=>{const id=byEn.get(it.en);if(id&&id!==it.id)map[it.id]=id;});maps[q0.id]=map;
    if(qText(loc)!==qText(q0)&&confirm(t('replaceQ',{n:q0.name}))){const r=remapQ(q0);state.questionnaires[i]=r.q;pQ(r.q);const m2={...map};for(const k in r.map)m2[k]=r.map[k];maps[q0.id]=m2;}}
  for(const p of d.projects)for(const a of p.analyses||[])if(maps[a.qid])remapA(a,maps[a.qid]);
  for(const p of d.projects){if(!p.id||!p.analyses)continue;
    const i=state.projects.findIndex(x=>x.id===p.id);
    if(i>=0){if(!confirm(t('replaceProject',{n:p.name})))continue;for(const a of state.projects[i].analyses)if(!p.analyses.some(x=>x.id===a.id))dA(a);state.projects[i]=p;}else state.projects.push(p);n++;
    p.analyses.forEach(a=>{a.vals=a.vals||{};a.pid=p.id;});pP(p);for(const a of p.analyses)pA(a,p.id,true);}
  save();toast(t('imported',{p:n}));render();
}

/* ---------- mutations ---------- */
function touch(){const p=proj();if(p)p.updated=new Date().toISOString();const a=ana();if(a)a._u=p.updated;}
function newAnalysis(p,qid){const a={id:uid(),pid:p.id,qid,date:today(),site:p.site||'',analyst:'',status:'draft',conclusions:'',marks:{},vals:{}};p.analyses.push(a);const lq=p.lastQ!==qid;p.lastQ=qid;touch();pA(a,p.id,true);if(lq)pP(p);return a;}
function setMark(id,patch){const a=ana();const m={...mark(a,id),...patch};if(m.s===0&&!(m.c&&m.c.trim()))delete a.marks[id];else a.marks[id]=m;touch();pA(a);}
function updateRow(id){const a=ana();const m=mark(a,id);const el=document.querySelector(`.item[data-id="${id}"]`);if(!el)return;
  el.className=`item s${m.s} ${m.c&&m.c.trim()?'hc':''}`;el.querySelector('.st').textContent=GL[m.s];el.setAttribute('aria-pressed',m.s===1);
  const q=qOf(a),b=q.blocks[+state.ui.step.slice(1)];if(!b)return;const c=blockCounts(a,b);
  const rb=document.querySelector(`.rail [data-step="${state.ui.step}"] .cnt`);if(rb)rb.innerHTML=cntHtml(c);
  const bh=document.getElementById('bcount');if(bh)bh.textContent=`${c.m} ${t('marked')} / ${c.tot}`;}
function cycle(id){const s=mark(ana(),id).s;setMark(id,{s:s?0:1});updateRow(id);}
function toggleComment(id,open){const w=document.querySelector(`[data-cw="${id}"]`);if(!w)return;const show=open??w.classList.contains('hidden');w.classList.toggle('hidden',!show);state.ui.openC=show?id:null;if(show){const ta=w.querySelector('textarea');ta.focus();ta.selectionStart=ta.value.length;}}
function setStep(s){state.ui.step=s;state.ui.openC=null;save();render();}

/* ---------- events ---------- */
const app=document.getElementById('app');
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-go],[data-lang],[data-step],[data-rep],[data-open-p],[data-del-p],[data-open-a],[data-rep-a],[data-dup-a],[data-del-a],[data-export-p],[data-export-all],[data-qsave],[data-qdel],[data-qrestore],[data-sync],[data-wipe],#newAna,#importBtn,#addQ,.item,.cb');
  if(!b)return;const d=b.dataset;
  if(b.classList.contains('cb')){e.stopPropagation();toggleComment(d.c);return;}
  if(b.classList.contains('item')){cycle(d.id);b.focus();return;}
  if(d.sync!==undefined){SYNC.openPanel();return;}
  if(d.lang){state.lang=d.lang;save();render();return;}
  if(d.go){state.ui.openC=null;go(d.go);return;}
  if(d.step){setStep(d.step);return;}
  if(d.rep){state.ui.report=d.rep;save();render();return;}
  if(d.openP){go('project',{pid:d.openP,aid:null});return;}
  if(d.delP){if(confirm(t('confirmDel'))){const p=state.projects.find(x=>x.id===d.delP);state.projects=state.projects.filter(x=>x.id!==d.delP);if(p)dP(p);else save();render();}return;}
  if(d.openA){go('analysis',{aid:d.openA,step:'details'});return;}
  if(d.repA){go('report',{aid:d.repA});return;}
  if(d.dupA){const p=proj();const src=p.analyses.find(a=>a.id===d.dupA);const c=JSON.parse(JSON.stringify(src));c.id=uid();c.date=today();c.status='draft';c.vals=c.vals||{};c.pid=p.id;p.analyses.push(c);touch();pA(c,p.id,true);render();return;}
  if(d.delA){if(confirm(t('confirmDel'))){const p=proj();const a=p.analyses.find(x=>x.id===d.delA);p.analyses=p.analyses.filter(x=>x.id!==d.delA);touch();if(a)dA(a);else save();render();}return;}
  if(d.exportP){exportProject(state.projects.find(p=>p.id===d.exportP));return;}
  if(d.exportAll!==undefined){exportAll();return;}
  if(d.qsave){saveQ(d.qsave);return;}
  if(d.qdel){if(confirm(t('confirmDelQ'))){const q=state.questionnaires.find(x=>x.id===d.qdel);state.questionnaires=state.questionnaires.filter(x=>x.id!==d.qdel);if(q)dQ(q);if(!state.questionnaires.length){const nq=blankQ();state.questionnaires=[nq];pQ(nq);}render();}return;}
  if(d.qrestore){const k=d.qrestore;const i=state.questionnaires.findIndex(q=>q.id===k);let q;if(i<0){q=starterQ(k);state.questionnaires.push(q);}else{if(!confirm(t('confirmRestore')))return;q=starterQ(k,state.questionnaires[i]);state.questionnaires[i]=q;}pQ(q);render();toast(t('saved'));return;}
  if(d.wipe!==undefined){if(!confirm(t('confirmWipe')))return;wipeAll();return;}
  if(b.id==='addQ'){const q=blankQ();state.questionnaires.push(q);pQ(q);render();return;}
  if(b.id==='newAna'){const p=proj();const sel=document.getElementById('newQsel');const qid=sel?sel.value:state.questionnaires[0].id;const a=newAnalysis(p,qid);go('analysis',{aid:a.id,step:'details'});return;}
  if(b.id==='importBtn'){document.getElementById('importFile').click();return;}
});
app.addEventListener('submit',e=>{if(e.target.id==='newProj'){e.preventDefault();const f=new FormData(e.target);const p={id:uid(),name:f.get('name').trim(),site:(f.get('site')||'').trim(),created:new Date().toISOString(),updated:new Date().toISOString(),analyses:[]};if(!p.name)return;state.projects.push(p);pP(p);go('project',{pid:p.id,aid:null});}});
function setField(el){const a=ana();if(!a)return;a[el.dataset.f]=el.value;touch();pA(a);}
function setVal(id,v){const a=ana();if(!a)return;if(hasVal(v))a.vals[id]=v;else delete a.vals[id];touch();pA(a);
  const b=qOf(a).blocks[+state.ui.step.slice(1)];if(!b)return;const c=blockCounts(a,b);const rb=document.querySelector(`.rail [data-step="${state.ui.step}"] .cnt`);if(rb)rb.innerHTML=cntHtml(c);const bh=document.getElementById('bcount');if(bh)bh.textContent=`${c.m} ${t('marked')} / ${c.tot}`;}
function fieldEvent(e){const el=e.target,d=el.dataset;const a=ana();if(!a)return false;
  if(d.f){setField(el);return true;}
  if(d.fv){setVal(d.fv,el.type==='number'?(el.value===''?'':+el.value):el.value);return true;}
  if(d.fmv){const cur=[...document.querySelectorAll(`[data-fmv="${d.fmv}"]:checked`)].map(x=>x.value);setVal(d.fmv,cur);return true;}
  if(d.fk){const v={...(a.vals[d.fk]||{})};v[d.k]=+el.value;setVal(d.fk,v);const o=document.querySelector(`[data-kwout="${d.fk}"]`);if(o)o.textContent=kwTextV(v);return true;}
  return false;}
app.addEventListener('input',e=>{if(fieldEvent(e))return;const el=e.target;if(el.dataset.cm){setMark(el.dataset.cm,{c:el.value});updateRow(el.dataset.cm);}});
app.addEventListener('change',fieldEvent);
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;f.text().then(importJSON);e.target.value='';});
app.addEventListener('keydown',e=>{
  const el=e.target;
  if(el.dataset.cm){if(e.key==='Escape'){e.preventDefault();toggleComment(el.dataset.cm,false);document.querySelector(`.item[data-id="${el.dataset.cm}"]`)?.focus();}return;}
  if(!el.classList.contains('item'))return;
  const id=el.dataset.id;const rows=[...document.querySelectorAll('.item')];const i=rows.indexOf(el);const k=e.key;
  const mv=j=>{const r=rows[Math.max(0,Math.min(j,rows.length-1))];if(r){r.focus();r.scrollIntoView({block:'nearest'});}};
  if(k==='ArrowDown'||k==='j'){e.preventDefault();mv(i+1);}
  else if(k==='ArrowUp'||k==='k'){e.preventDefault();mv(i-1);}
  else if(k===' '){e.preventDefault();cycle(id);}
  else if(k==='c'||k==='C'||k==='Enter'){e.preventDefault();toggleComment(id,true);}
  else if(k==='Escape'){el.blur();}
});
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  if(state.ui.view!=='analysis')return;const a=ana();if(!a)return;
  const order=stepOrder(qOf(a));const i=order.indexOf(state.ui.step);
  if((e.key==='ArrowRight'||e.key===']')&&i<order.length-1)setStep(order[i+1]);
  else if((e.key==='ArrowLeft'||e.key==='[')&&i>0)setStep(order[i-1]);
});

function setPrintOrientation(){let s=document.getElementById('pp');if(!s){s=document.createElement('style');s.id='pp';document.head.appendChild(s);}
  const land=state.ui.view==='report'&&state.ui.report==='full';s.textContent=`@page{size:A4 ${land?'landscape':'portrait'};margin:14mm 12mm}`;}

boot();
</script>
<script>/* offline shell: see sw.js */ if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(e=>console.warn("sw",e));</script>
